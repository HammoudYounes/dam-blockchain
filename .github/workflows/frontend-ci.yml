name: Frontend CI

on:
  push:
    branches: ["main", "develop"]
    paths: ["frontend/dam-app/**"]
  pull_request:
    branches: ["main", "develop"]
    paths: ["frontend/dam-app/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/dam-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/dam-app/package-lock.json
      - run: npm ci
      - run: npm run build
